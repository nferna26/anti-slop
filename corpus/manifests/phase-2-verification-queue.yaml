    source_id: BK-0001
    title: "Good Strategy Bad Strategy"
    author: "Rumelt, Richard"
    reason: "Strategy diagnosis anchor; map candidate and deep-card candidate."
    acquisition_status: sourced
    raw_source_status: local_only
    edition_verified: true
    locator_status: chosen
    map_status: reviewed
    next_operator_action: "Map operator-reviewed. Begin source-card selection from the mapped chapters of corpus/book-maps/BK-0001.md; draft source cards one at a time with operator review per card."
