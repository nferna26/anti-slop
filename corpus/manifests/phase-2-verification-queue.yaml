  - source_id: BK-0020
    title: "Shape Up"
    reason: "Currently metadata_only; rights/access status needs operator verification before any excerpting or mapping."
  - source_id: BK-0046
    title: "To Err Is Human"
    reason: "Currently metadata_only; rights/access status needs operator verification before any excerpting or mapping."

done_when:
  - "All five verification_batch sources have edition_verified: true in acquisition-registry.yaml and corresponding public-safe book maps at corpus/book-maps/BK-XXXX.md. (Met as of the first-five batch.)"
  - "All five public-safe book maps have completed operator review and have operator_review_status: reviewed in their frontmatter."
  - "At least one source has begun source-card selection from its reviewed map."
  - "No public raw paths, filenames, raw text, or long excerpts have been added."
  - "make validate, make check-raw, make kb-lint, and make report pass."
