status: active
phase: phase-2
purpose: "Track the first-five verified, map-ready sources through map review and into source-card selection."
selection_rule: "Prioritize wave-1 sources that are already sourced locally, marked as map candidates, and marked as first-five deep-card candidates."
publication_rule: no_raw_copyrighted_text_in_public_repo

operator_constraints:
  - "Verify lawful access before mapping."
  - "Verify edition metadata from the actual lawful source, not from filenames."
  - "Choose a locator system before creating a book map."
  - "Do not copy raw book text into the public repo."
  - "Do not draft source cards until the corresponding book map has been operator-reviewed."

verification_batch:
