name: ci

# Deterministic, offline dogfood of the Anti-Slop KB gates and the
# citation-lineage tool. No model, API, network, credential, or raw book is
# used; every step is stdlib-only Python plus make.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifest + registry validation
        run: make validate
      - name: No raw copyrighted text
        run: make check-raw
      - name: KB lint
        run: make kb-lint
      - name: Scripts compile
        run: python3 -m py_compile scripts/*.py
      - name: Citation-lineage gate self-test
        run: python3 scripts/gate_citation_lineage.py --self-test
      - name: No-universalization gate self-test
        run: python3 scripts/gate_no_universalization.py --self-test
      - name: Citation-lineage dogfood (corpus + eval design/decision docs)
        run: make citation-dogfood
      - name: Citation-lineage demo (compile-brief -> gate -> receipt)
        run: make demo
      - name: Artifact preflight (strict)
        run: python3 scripts/artifact_preflight.py --strict
